<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {% block title %}
        Contact Manager
        {% endblock %}
    </title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='/style.css') }}"
    >

</head>

<body>

<nav class="navbar">

    <div class="logo">
        📱 Contact Manager
    </div>

    {% if session.get("user_id") %}

    <div class="nav-links">

        <a href="{{ url_for('dashboard') }}">
            Dashboard
        </a>

        <a href="{{ url_for('add_contact') }}">
            Add Contact
        </a>

        <a href="{{ url_for('profile') }}">
            Profile
        </a>

        <a href="{{ url_for('logout') }}">
            Logout
        </a>

    </div>

    {% endif %}

</nav>


<div class="container">

    {% with messages = get_flashed_messages(with_categories=true) %}

        {% for category, message in messages %}

            <div class="alert {{ category }}">
                {{ message }}
            </div>

        {% endfor %}

    {% endwith %}


    {% block content %}
    {% endblock %}

</div>


<script
    src="{{ url_for('static', filename='/script.js') }}"
></script>

</body>

</html>

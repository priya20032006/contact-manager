{% extends "base.html" %}

{% block title %}
Profile
{% endblock %}

{% block content %}

<div class="form-box">

    <h1>👤 My Profile</h1>

    <form method="POST">

        <label>Name</label>

        <input
            type="text"
            name="name"
            value="{{ user['name'] }}"
            required
        >


        <label>Email</label>

        <input
            type="email"
            value="{{ user['email'] }}"
            disabled
        >


        <button type="submit">
            Update Profile
        </button>

    </form>

</div>

{% endblock %}

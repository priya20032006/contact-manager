{% extends "base.html" %}

{% block title %}
Register
{% endblock %}

{% block content %}

<div class="auth-box">

    <h1>📝 Create Account</h1>

    <form method="POST">

        <label>Name</label>

        <input
            type="text"
            name="name"
            placeholder="Your name"
            required
        >


        <label>Email</label>

        <input
            type="email"
            name="email"
            placeholder="Your email"
            required
        >


        <label>Password</label>

        <input
            type="password"
            name="password"
            placeholder="Password"
            required
        >


        <label>Confirm Password</label>

        <input
            type="password"
            name="confirm_password"
            placeholder="Confirm password"
            required
        >


        <button type="submit">
            Register
        </button>

    </form>


    <p>
        Already have an account?

        <a href="{{ url_for('login') }}">
            Login
        </a>
    </p>

</div>

{% endblock %}
